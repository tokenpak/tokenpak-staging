name: Identity & language check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  identity-language:
    name: No internal identity / workflow language in changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --diff-filter=AM "$base" "$head" \
            | grep -vE "^(packages/tests/|tests/|sdk/dist/)" \
            | grep -E '\.(md|py|txt|jsonl|yml|yaml|json|toml|cfg|ini|rst|sh|js|ts|tsx)$' \
            > changed-files.txt || true
          echo "Changed files (filtered):"
          sed 's/^/  /' changed-files.txt

      - name: Scan changed files
        run: |
          if [ ! -s changed-files.txt ]; then
            echo "No relevant files changed; skipping."
            exit 0
          fi
          python scripts/release_gate/public_safety_scan.py \
            --paths-from changed-files.txt \
            --root . \
            --annotation error
