name: HOLD Merge Guard

# HOLD-Merge Discipline backstop — governance merge-discipline policy (ratified 2026-06-14).
#
# The HOLD-Merge Discipline policy makes "[HOLD] in a PR title" a hard merge-block. This
# workflow is the machine-enforced backstop for that discipline: it emits a
# FAILING check status whenever a pull request is marked on-hold, so that once
# the check is registered as a *required* status check, an on-hold PR cannot be
# merged.
#
# A pull request is considered ON HOLD when EITHER:
#   - its title contains the token "[HOLD]" (case-insensitive), OR
#   - it carries a label named "hold" (case-insensitive).
#
# The guard PASSES on every other PR, so it is non-blocking for normal flow.
#
# ROLLOUT: this workflow reports a real pass/fail status as soon as it lands,
# but it does NOT gate merge on its own until it is added to branch protection
# as a *required* status check. Making it required is a branch-protection
# change and a Kevin moment-of-action — see the release-prep package
# (02_COMMAND_CENTER/release-prep/hold-merge-guard/). Until then the check runs
# and reports advisory pass/fail without blocking.
#
# Cross-refs: the governance HOLD-merge discipline policy, the shared-account
# commit-identity rules, and the merge-captain ledger.

on:
  pull_request:
    # opened/edited cover the title; labeled/unlabeled cover the "hold" label;
    # synchronize/reopened keep the status current as the PR evolves.
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  hold-merge-guard:
    name: HOLD merge guard
    runs-on: ubuntu-latest
    steps:
      - name: Block merge while PR is on hold
        # SECURITY: the PR title and labels are untrusted input. They are passed
        # via env (never interpolated into the run script), so a hostile title
        # such as "$(...)" or backticks cannot inject shell commands.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Case-insensitive detection of the "[hold]" token in the title.
          title_lc="$(printf '%s' "$PR_TITLE" | tr '[:upper:]' '[:lower:]')"

          held_by_title=false
          held_by_label=false

          case "$title_lc" in
            *'[hold]'*) held_by_title=true ;;
          esac

          # PR_LABELS is a JSON array of label names. Match "hold"
          # case-insensitively against the label set.
          if printf '%s' "$PR_LABELS" \
               | jq -e 'map(ascii_downcase) | index("hold") != null' >/dev/null; then
            held_by_label=true
          fi

          if [ "$held_by_title" = true ] || [ "$held_by_label" = true ]; then
            echo "::error title=PR is on hold::This pull request is marked ON HOLD and must not be merged."
            echo "held_by_title = ${held_by_title}"
            echo "held_by_label = ${held_by_label}"
            echo "title  : ${PR_TITLE}"
            echo "labels : ${PR_LABELS}"
            echo
            echo "Per the HOLD-Merge Discipline policy: remove the [HOLD] token from"
            echo "the title AND drop the 'hold' label before this PR can merge."
            exit 1
          fi

          echo "PR is not on hold (no [HOLD] title token, no 'hold' label) — guard passes."
